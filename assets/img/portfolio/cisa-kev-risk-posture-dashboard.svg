    <text x="136" y="311" fill="#9fb3c8" font-size="14">All vendors</text>
    <text x="118" y="374" fill="#d8e2ee" font-size="17" font-weight="650">Exploit Status</text>
    <rect x="118" y="395" width="156" height="40" rx="8" fill="#0d2238" stroke="#244967"/>
    <text x="136" y="420" fill="#9fb3c8" font-size="14">Known exploited</text>
    <text x="118" y="483" fill="#d8e2ee" font-size="17" font-weight="650">SLA Window</text>
    <rect x="118" y="504" width="156" height="40" rx="8" fill="#0d2238" stroke="#244967"/>
    <text x="136" y="529" fill="#9fb3c8" font-size="14">0-30 days</text>
    <text x="118" y="592" fill="#d8e2ee" font-size="17" font-weight="650">Risk Tier</text>
    <rect x="118" y="613" width="156" height="40" rx="8" fill="#0d2238" stroke="#244967"/>
    <text x="136" y="638" fill="#9fb3c8" font-size="14">High + Critical</text>
  </g>

  <rect x="118" y="760" width="156" height="138" rx="18" fill="#0d2238" stroke="#244967"/>
  <text x="196" y="802" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2" fill="#9bdcf5">PROJECT GOAL</text>
  <text x="196" y="840" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Prioritize</text>
  <text x="196" y="866" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">remediation</text>
  <text x="196" y="892" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">by business risk</text>

