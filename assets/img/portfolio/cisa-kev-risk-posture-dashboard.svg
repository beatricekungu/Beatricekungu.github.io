<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CISA KEV Risk Posture Power BI Dashboard Concept</title>
  <desc id="desc">A polished executive-style dark Power BI dashboard thumbnail for a vulnerability remediation analytics project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0b3458"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0c1b2b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d8e2ee" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <rect x="70" y="60" width="1780" height="960" rx="26" fill="#07111f" fill-opacity="0.64" stroke="#9bdcf5" stroke-opacity="0.14" filter="url(#softShadow)"/>

  <rect x="70" y="60" width="250" height="960" rx="26" fill="#06101d"/>
  <path d="M294 60h26v960h-26z" fill="#06101d"/>
  <line x1="320" y1="60" x2="320" y2="1020" stroke="#9bdcf5" stroke-opacity="0.12"/>

  <g transform="translate(118 110)">
