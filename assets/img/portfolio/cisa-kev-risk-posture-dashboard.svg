      <rect width="6" height="130" rx="3" fill="#f59e0b"/>
      <text x="32" y="38" fill="#9fb3c8" font-size="15" font-weight="800" letter-spacing="1.1">SLA COMPLIANCE</text>
      <text x="32" y="92" fill="#ffffff" font-size="48" font-weight="850">78%</text>
      <path d="M238 92a42 42 0 1 1 70 0" fill="none" stroke="#244967" stroke-width="13" stroke-linecap="round"/>
      <path d="M238 92a42 42 0 0 1 58-39" fill="none" stroke="#f59e0b" stroke-width="13" stroke-linecap="round"/>
    </g>
  </g>

