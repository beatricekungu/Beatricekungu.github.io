      <text x="32" y="38" fill="#9fb3c8" font-size="15" font-weight="800" letter-spacing="1.1">VENDORS AFFECTED</text>
      <text x="32" y="92" fill="#ffffff" font-size="48" font-weight="850">42</text>
      <rect x="235" y="42" width="74" height="52" rx="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="3"/>
      <path d="M252 61h40M252 76h26" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(1450 270)">
