      <text x="32" y="38" fill="#9fb3c8" font-size="15" font-weight="800" letter-spacing="1.1">CRITICAL OVERDUE</text>
      <text x="32" y="92" fill="#ffffff" font-size="48" font-weight="850">127</text>
      <circle cx="270" cy="66" r="34" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="3"/>
      <text x="270" y="78" text-anchor="middle" fill="#f43f5e" font-size="36" font-weight="900">!</text>
