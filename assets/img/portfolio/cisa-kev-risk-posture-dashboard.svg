      <line x1="405" y1="560" x2="975" y2="560"/><line x1="405" y1="610" x2="975" y2="610"/><line x1="405" y1="660" x2="975" y2="660"/>
    </g>
    <path d="M415 640 C455 570 490 610 530 550 C570 500 610 620 650 560 C700 470 740 510 780 468 C820 520 850 545 885 490 C925 430 950 480 975 448" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round"/>
    <path d="M415 666 C465 650 505 640 548 625 C610 610 650 615 696 585 C735 560 790 575 826 538 C875 515 920 530 975 500" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12"/>

    <rect x="1055" y="435" width="725" height="260" rx="18" fill="url(#panel)" stroke="#244967"/>
    <text x="1090" y="480" fill="#ffffff" font-size="20" font-weight="800">Risk Mix by Remediation Status</text>
    <circle cx="1250" cy="585" r="86" fill="none" stroke="#f43f5e" stroke-width="36" stroke-dasharray="270 540" transform="rotate(-90 1250 585)"/>
    <circle cx="1250" cy="585" r="86" fill="none" stroke="#f59e0b" stroke-width="36" stroke-dasharray="170 540" stroke-dashoffset="-270" transform="rotate(-90 1250 585)"/>
    <circle cx="1250" cy="585" r="86" fill="none" stroke="#5eead4" stroke-width="36" stroke-dasharray="100 540" stroke-dashoffset="-440" transform="rotate(-90 1250 585)"/>
    <text x="1250" y="575" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="850">22%</text>
    <text x="1250" y="607" text-anchor="middle" fill="#9fb3c8" font-size="14">overdue</text>
    <rect x="1420" y="520" width="18" height="18" rx="4" fill="#f43f5e"/><text x="1450" y="535" fill="#d8e2ee" font-size="16">Overdue critical</text>
    <rect x="1420" y="570" width="18" height="18" rx="4" fill="#f59e0b"/><text x="1450" y="585" fill="#d8e2ee" font-size="16">Due within SLA</text>
    <rect x="1420" y="620" width="18" height="18" rx="4" fill="#5eead4"/><text x="1450" y="635" fill="#d8e2ee" font-size="16">Remediated</text>

    <rect x="370" y="730" width="650" height="230" rx="18" fill="url(#panel)" stroke="#244967"/>
    <text x="405" y="775" fill="#ffffff" font-size="20" font-weight="800">Top Affected Vendors</text>
    <g font-size="15" fill="#d8e2ee">
      <text x="405" y="830">Microsoft</text><rect x="555" y="812" width="390" height="24" rx="8" fill="#38bdf8"/>
      <text x="405" y="875">Cisco</text><rect x="555" y="857" width="310" height="24" rx="8" fill="#5eead4"/>
      <text x="405" y="920">VMware</text><rect x="555" y="902" width="250" height="24" rx="8" fill="#f59e0b"/>
    </g>

    <rect x="1055" y="730" width="725" height="230" rx="18" fill="url(#panel)" stroke="#244967"/>
    <text x="1090" y="775" fill="#ffffff" font-size="20" font-weight="800">Audit Evidence Output</text>
    <rect x="1090" y="815" width="650" height="48" rx="10" fill="#07111f" stroke="#244967"/>
    <rect x="1090" y="872" width="650" height="48" rx="10" fill="#07111f" stroke="#244967"/>
    <rect x="1090" y="929" width="650" height="48" rx="10" fill="#07111f" stroke="#244967"/>
    <text x="1116" y="846" fill="#5eead4" font-size="16" font-weight="750">Control evidence: owner, SLA, exception, remediation status</text>
    <text x="1116" y="903" fill="#d8e2ee" font-size="16">Executive summary: risk exposure reduced by priority queue</text>
    <text x="1116" y="960" fill="#d8e2ee" font-size="16">Operational drilldown: CVE, vendor, product, deadline, action</text>
  </g>
</svg>
