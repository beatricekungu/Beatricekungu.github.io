<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1120">
  <title>Page Not Found | Beatrice Kungu</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: radial-gradient(circle at 20% 15%, rgba(19,135,193,.22), transparent 32%), #0b1120; color: #dbe8f5; }
    .not-found-shell { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .not-found-card { width: min(760px, 100%); padding: clamp(30px, 7vw, 64px); border: 1px solid rgba(107,204,255,.25); border-radius: 24px; background: rgba(14,27,46,.88); box-shadow: 0 30px 90px rgba(0,0,0,.38); text-align: center; }
    .not-found-code { display: block; color: #6bccff; font: 800 clamp(4rem, 16vw, 8rem)/.9 Poppins, sans-serif; }
    .not-found-card h1 { margin: 22px 0 14px; color: #fff; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .not-found-card p { max-width: 580px; margin: 0 auto; color: #b8c9dc; line-height: 1.75; }
    .not-found-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .not-found-actions a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border: 1px solid #6bccff; border-radius: 999px; color: #06111e; background: #6bccff; font-weight: 800; }
    .not-found-actions a:last-child { color: #dff7ff; background: transparent; }
  </style>
</head>
<body>
  <main class="not-found-shell">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <span class="not-found-code">404</span>
      <h1 id="not-found-title">That page isn’t part of the portfolio.</h1>
      <p>The link may have changed, but the completed cybersecurity, GRC, cloud security, IAM, and risk analytics work is still easy to find.</p>
      <div class="not-found-actions">
        <a href="/"><i class="bi bi-house"></i> Return Home</a>
        <a href="/projects/"><i class="bi bi-grid"></i> View Projects</a>
      </div>
    </section>
  </main>
</body>
</html>
